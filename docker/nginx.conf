server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        # Keep the browser Host: the backend's write guard requires a loopback
        # Host whose scheme://netloc matches the request Origin.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # Dictated-goal recordings: the backend bounds them at 10 MiB.
    location = /api/transcriptions {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 11m;
    }

    location / {
        try_files $uri /index.html;
    }
}
