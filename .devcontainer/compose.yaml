name: visto-dev

services:
  dev:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    platform: linux/amd64
    init: true
    command: sleep infinity
    environment:
      # Docker Desktop forwards host.docker.internal to the host loopback, where the
      # host adb server owns USB phones; console Refresh bridges them (docs/docker.md).
      # Set VISTO_HOST_ADB= (empty) to disable.
      VISTO_HOST_ADB: ${VISTO_HOST_ADB-host.docker.internal:5037}
    volumes:
      - ..:/workspaces/visto:cached
      # Linux-only state over host paths: faster than the host bind mount, whose
      # host-created files also reject utime, and never mixed with a Windows or
      # macOS checkout's toolchains, caches or build output.
      - dev-work:/workspaces/visto/.work
      - dev-venv:/workspaces/visto/backend/.venv
      - dev-backend-dist:/workspaces/visto/backend/dist
      - dev-frontend-modules:/workspaces/visto/frontend/node_modules
      - dev-cache:/home/vscode/.cache

  appium:
    build:
      context: ..
      dockerfile: docker/appium.Dockerfile
    platform: linux/amd64
    init: true
    # Same loopback contract as the production stack: 127.0.0.1:4723 and the
    # adb server on 127.0.0.1:5037 are reachable from the dev container.
    network_mode: service:dev
    environment:
      ADB_CONNECT: ${ADB_CONNECT:-}
    volumes:
      - adb-keys:/home/node/.android

volumes:
  dev-work:
  dev-venv:
  dev-backend-dist:
  dev-frontend-modules:
  dev-cache:
  adb-keys:
