# Full stack: docker compose up --build, then open http://localhost:8080.
# See docs/docker.md for device connection (wireless debugging or Linux USB).
name: visto

services:
  # Owns the network namespace shared by backend and appium (pod pattern). The
  # backend reaches Appium and the adb server on 127.0.0.1, as its loopback-only
  # Appium policy requires; either service can be recreated without the other.
  net:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    init: true
    restart: unless-stopped
    networks:
      default:
        aliases: [backend]

  appium:
    build:
      context: .
      dockerfile: docker/appium.Dockerfile
    # Google publishes Linux platform-tools for x86_64 only (emulated on arm64 hosts).
    platform: linux/amd64
    init: true
    restart: unless-stopped
    network_mode: service:net
    environment:
      ADB_CONNECT: ${ADB_CONNECT:-}
    volumes:
      # adb host key, so devices stay authorized across restarts.
      - adb-keys:/home/node/.android

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    network_mode: service:net
    depends_on:
      # The adb server must start in appium (which owns devices) before the
      # backend's adb client could otherwise spawn one of its own.
      - appium
    environment:
      # Docker Desktop forwards host.docker.internal to the host loopback, where the
      # host adb server owns USB phones; console Refresh bridges them (docs/docker.md).
      # Set VISTO_HOST_ADB= (empty) to disable.
      VISTO_HOST_ADB: ${VISTO_HOST_ADB-host.docker.internal:5037}
    volumes:
      # Run history, screenshots and device leases.
      - work:/app/.work
      # Provider key, read by the backend itself (never baked into an image).
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only: the backend rejects console writes from non-loopback hosts.
      - "127.0.0.1:${VISTO_WEB_PORT:-8080}:8080"

volumes:
  work:
  adb-keys:
