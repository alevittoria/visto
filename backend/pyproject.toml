[project]
name = "visto"
version = "0.1.0"
description = "Mobile app testing with AI-owned navigation and semantic assessment"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pillow==13.0.0",
  "pydantic==2.14.0",
  "uvicorn==0.54.0",
]

[project.scripts]
visto = "visto.cli:entry"

[dependency-groups]
dev = [
  "httpx2==2.13.1",
  "pytest==9.1.1",
  "ruff==0.17.0",
]
build = ["hatchling==1.32.4", "editables==0.6"]

[build-system]
requires = ["hatchling==1.32.4", "editables==0.6"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.hatch.build.targets.wheel]
# Build outputs copied in by scripts/build_release.py; ignored by git, so listed as
# artifacts. Optional: a checkout without them still builds. components.json and
# android-sdk-license.txt are tracked package files and are included as such.
artifacts = ["src/visto/console/**", "src/visto/toolchain/appium/**"]

[tool.hatch.build.targets.wheel.force-include]
"prompts/agent-core.md" = "visto/prompts/agent-core.md"
"prompts/android-agent-v3.md" = "visto/prompts/android-agent-v3.md"
"prompts/ios-agent-v1.md" = "visto/prompts/ios-agent-v1.md"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
